---
name: CI

on:
  push:
    branches: [main, master, release/public-v0.1.0]
  pull_request:
    branches: [main, master, release/public-v0.1.0]

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    defaults:
      run:
        working-directory: ./src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libayatana-appindicator3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry and index
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: cargo fmt check
        run: cargo fmt --manifest-path Cargo.toml --check

      - name: cargo check
        run: cargo check --manifest-path Cargo.toml

      - name: cargo test
        run: cargo test --manifest-path Cargo.toml --all-targets

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vitest test
        run: npm test

      - name: Build
        run: npm run build

  doctor:
    name: Doctor (preflight)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run doctor
        run: npm run doctor

  yaml-lint:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          files=$(find . -name "*.yml" -o -name "*.yaml")
          if [ -z "$files" ]; then
            echo "No YAML files found."
          else
            echo "Linting YAML files:"
            echo "$files"
            yamllint $files
          fi
